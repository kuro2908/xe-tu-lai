  miss:'nghiên cứu hoàn toàn độc lập ở thời điểm quyết định, số liệu theo thời tiết, đêm, đường cao tốc.',
  good:'công bố dữ liệu an toàn và dùng bên ngoài để kiểm chứng.',
  open:'khi bên bảo hiểm cùng thực hiện nghiên cứu với công ty, mức tin cậy nên là bao nhiêu? Mẫu chỉ có 11 khiếu nại; con số 88%/92% có đủ làm bằng chứng không?'}
}];

/* ---------- RENDER ---------- */
const $=s=>document.querySelector(s);
const tabs=[{id:'home',label:'Tổng quan'},...cases.map(c=>({id:c.id,label:c.tab})),{id:'common',label:'Điểm chung & nguồn'}];
$('#tabs').innerHTML=tabs.map(t=>`<button role="tab" data-id="${t.id}" aria-selected="false">${t.label}</button>`).join('');

function home(){
 return `<section class="panel" id="p-home">
 <h2>Bằng chứng nào đủ để thêm xe, thêm vùng chạy?</h2>
 <p class="lead">Bộ tài liệu hoạt động nhóm, ngày 10 · 2–3 người một case · mỗi case có thẻ tình huống, kết cục, khó khăn đã gặp, giải pháp và kết quả (riêng Case B VinFast chưa có kết cục vì còn đang diễn ra).</p>
 <div class="card"><h3>Thứ tự 5 bước</h3>
  <ol class="steps">
   <li><b>Câu 1.</b> Chuyện gì đã xảy ra đến lúc này? Bằng chứng nào, ai đưa ra?</li>
   <li><b>Câu 3.</b> Nếu là bạn lúc đó, bạn quyết gì? Chọn 1 trong 4 hướng (đi tiếp · đi tiếp hẹp hơn có điều kiện · làm thêm rồi quyết lại · dừng) và ghi 1 câu lý do.</li>
   <li><b>Nhận kết cục.</b> Chỉ mở phong bì (✉) khi ô quyết định đã có chữ.</li>
   <li><b>Câu 2.</b> Vì sao họ dừng lại, hoặc vì sao họ đi tiếp được? Xem cả khó khăn, giải pháp, kết quả.</li>
   <li><b>Sticky.</b> 2–3 tờ vàng (điều còn thiếu) và 1 tờ xanh (điều họ làm tốt).</li></ol>
  <p class="src">Cuối phiếu: quyết định của nhóm so với điều đã xảy ra – Khớp · Khác hướng nhưng vẫn hợp lý · Nếu biết kết cục, nhóm sẽ đổi.</p></div>
 <div class="overview">${cases.map(c=>`<button class="ocard" data-go="${c.id}"><span class="chip">Case ${c.id} · ${c.flag}</span><b>${c.title}</b><span>${c.teaser}</span></button>`).join('')}</div>
 <div class="note" style="margin-top:16px"><b>Cách đọc độ tin cậy.</b> Mỗi con số trong bảng bằng chứng có nhãn: ${OK} khớp nguồn khi tra lại ngày 18/11/2026; ${PART} một nguồn báo chí, nguồn thứ cấp hoặc hãng tự công bố. Các dữ kiện không kiểm chứng được đã được xóa khỏi bản này.</div>
 </section>`;
}

function casePanel(c,i){
 const prev=cases[i-1],next=cases[i+1];
 return `<section class="panel" id="p-${c.id}">
 <div class="hero"><span class="chip">Case ${c.id} · ${c.flag}</span><span class="chip neutral">Hãng thật: ${c.real} (ẩn tên khi phát cho học sinh)</span></div>
 <h2>${c.title}</h2>
 <p class="lead">${c.context}</p>

 <div class="card"><h3>1 · Thẻ case: bằng chứng đang có</h3>
  <ul class="ev">${c.evidence.map(e=>`<li>${e[0]}<span class="src">Nguồn: ${e[1]}</span></li>`).join('')}</ul>
  <p style="margin:14px 0 0"><b>Áp lực:</b> ${c.pressure}</p>
  <div class="role"><b>Bạn là ai, cần quyết gì</b>${c.role}</div>
 </div>

 <details class="env"><summary>Phong bì kết cục – chỉ mở khi ô quyết định đã có chữ</summary><div class="in">
  <p>${c.outcome}</p>
  <div class="bignum">${c.nums.map(n=>`<div><strong>${n[0]}</strong><small>${n[1]}</small></div>`).join('')}</div>
 </div></details>

 <div class="card"><h3>2 · Khó khăn → Giải pháp → Kết quả đến nay</h3>
  <div class="grid3">
   <div class="col k"><h4>Khó khăn đã gặp</h4><ul>${c.hard.map(x=>`<li>${x}</li>`).join('')}</ul></div>
   <div class="col g"><h4>Giải pháp họ dùng</h4><ul>${c.sol.map(x=>`<li>${x}</li>`).join('')}</ul></div>
   <div class="col r"><h4>Kết quả hiện tại</h4><ul>${c.res.map(x=>`<li>${x}</li>`).join('')}</ul></div>
  </div></div>

 <div class="card"><h3>3 · Bảng đối chiếu bằng chứng &amp; link nguồn</h3>
  <div class="tw"><table><thead><tr><th>Con số / dữ kiện</th><th>Độ tin cậy</th><th>Nguồn</th></tr></thead>
  <tbody>${c.table.map(r=>`<tr><td>${r[0]}</td><td>${r[1]}</td><td>${r[2]}</td></tr>`).join('')}</tbody></table></div></div>

 ${c.hyp?`<div class="note"><b>Nhận định của nhóm: agent AI mới và tiến độ</b><br>${c.hyp.claim}<ul style="margin:8px 0 8px">${c.hyp.why.map(x=>`<li>${x}</li>`).join('')}</ul><i>${c.hyp.check}</i></div>`:''}
 <div class="card"><h3>4 · Gợi ý cho giáo viên</h3>
  <div class="teach">
   <div class="t-n"><b>Vì sao đi tiếp / dừng</b>${c.teacher.why}</div>
   <div class="t-y"><b>Sticky vàng · điều còn thiếu</b>${c.teacher.miss}</div>
   <div class="t-g"><b>Sticky xanh · điều làm tốt</b>${c.teacher.good}</div>
   <div class="t-b"><b>Câu hỏi mở</b>${c.teacher.open}</div>
  </div></div>

 <div class="pager">${prev?`<button data-go="${prev.id}">← Case ${prev.id}</button>`:'<button data-go="home">← Tổng quan</button>'}
 ${next?`<button data-go="${next.id}">Case ${next.id} →</button>`:'<button data-go="common">Điểm chung →</button>'}</div>
 </section>`;
}

function common(){
 return `<section class="panel" id="p-common">
 <h2>Điểm chung để cả lớp thảo luận</h2>
 <p class="lead">Nhìn xuyên suốt 4 case: điều gì giúp “đi tiếp được”, điều gì buộc phải dừng.</p>
 <div class="card"><ul>
  <li>Những bên “đi tiếp được” đều có ít nhất một điều: mở rộng theo bậc thay vì một bước, dữ liệu có người ngoài kiểm tra, quan hệ minh bạch với cơ quan quản lý, và chi phí mỗi xe giảm dần.</li>
  <li>Hai bên gặp khó nhất (Cruise, và một phần Tesla) đều có vấn đề về niềm tin vào dữ liệu hoặc về tốc độ so với lời hứa, không chỉ về công nghệ.</li>
  <li>VinFast cho thấy một tình huống khác: chưa có kết cục để so sánh. Kế hoạch (200 xe cấp 4, cuối 2027) đã công bố, nhưng giấy phép và dữ liệu an toàn thì chưa có, nên điều cần học là biết đòi bằng chứng gì trước khi chấp thuận.</li>
  <li>Waymo cho thấy “có người ngoài kiểm chứng” cũng có giới hạn: mẫu nhỏ (11 khiếu nại), cùng do hãng và bên bảo hiểm thực hiện, chưa bình duyệt khi công bố.</li></ul>
  <p><b>Câu hỏi gợi ý:</b> (1) Giải pháp nào trong bốn case có người ngoài kiểm chứng, giải pháp nào chỉ do chính công ty nói? (2) Nếu Cruise làm điều tra độc lập ngay từ tuần đầu, kết cục có khác không? (3) Số liệu nào bạn muốn kiểm lại trước khi tin?</p></div>
 <div class="card"><h3>Bảng tổng hợp</h3><div class="tw"><table>
  <thead><tr><th>Case</th><th>Kết cục</th><th>Điều giúp họ đi tiếp / khiến họ dừng</th></tr></thead><tbody>
  <tr><td>A · Tesla</td><td>Đi tiếp, bỏ giám sát viên sau 7 tháng</td><td>Quy mô nhỏ, hỗ trợ từ xa, không có cơ quan chặn trước; điểm yếu: dữ liệu do hãng nắm, sự cố vẫn tăng</td></tr>
  <tr><td>B · VinFast</td><td>Chưa có kết cục (kế hoạch cuối 2027, chưa cấp phép)</td><td>Hợp tác đối tác công nghệ, thử trong khu đô thị riêng; thiếu dữ liệu an toàn công khai và khung cấp phép</td></tr>
  <tr><td>C · Cruise</td><td>Dừng: mất phép, GM ngừng tài trợ 12/2024</td><td>Mất niềm tin vào dữ liệu và cách báo cáo, không chỉ do tai nạn</td></tr>
  <tr><td>D · Waymo</td><td>Đi tiếp, mở rộng mạnh</td><td>Mở rộng theo bậc, dữ liệu có bên thứ ba kiểm tra, vốn lớn</td></tr></tbody></table></div></div>
 <div class="card"><h3>Những điểm đã sửa so với bản trước (kiểm lại 18/11/2026)</h3><ul>
  <li><b>Đã xác nhận:</b> Cruise cắt 24% (≈ 900 người), 9 lãnh đạo thôi việc, thu hồi khoảng 950 xe, phạt 500.000 USD (11/2024), cắt khoảng một nửa nhân sự đầu 2025; Waymo huy động 16 tỷ USD; Tesla chạy không giám sát ở Austin, Dallas, Houston; VinFast: các thông cáo 27/1/2026 và 1/6/2026, kế hoạch 200 xe cấp 4 ở Cần Giờ (báo cáo quý II/2026).</li>
  <li><b>Đã xóa vì không kiểm chứng được:</b> Tesla “6 thành phố”, “42 xe đăng ký ở Texas”, số xe theo dõi của bên thứ ba, mục tiêu 7 thành phố; Cruise mốc chạy lại thử nghiệm, cắt đội xe 300 → 50/150, CEO từ chức, điều tra phanh gấp, đợt cắt nhân sự nhỏ sau 2/2025; Waymo “nghiên cứu độc lập 81%”, 500.000 chuyến/tuần ở 10 thành phố, thế hệ 6 giảm một nửa chi phí, mô tả cảm biến, chi phí phần cứng; VinFast chuyến thử ở Đức; Baidu (case cũ) đã thay bằng VinFast.</li>
  </ul></div>
 <div class="pager"><button data-go="D">← Case D</button><button data-go="home">Về tổng quan</button></div>
 </section>`;
}

$('#main').innerHTML=home()+cases.map(casePanel).join('')+common();

function show(id){
 if(!tabs.some(t=>t.id===id)) id='home';
 document.querySelectorAll('.panel').forEach(p=>p.classList.toggle('on',p.id==='p-'+id));
 document.querySelectorAll('#tabs button').forEach(b=>{
  const on=b.dataset.id===id; b.setAttribute('aria-selected',on);
  if(on) b.scrollIntoView({inline:'center',block:'nearest'});
 });
 try{history.replaceState(null,'','#'+id)}catch(e){}
 window.scrollTo({top:0});
}
document.addEventListener('click',e=>{
 const b=e.target.closest('[data-id],[data-go]'); if(!b) return;
 show(b.dataset.id||b.dataset.go);
});
show(location.hash.slice(1)||'home');
</script>
</body>
